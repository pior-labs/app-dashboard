name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      # pnpm reads ~/.npmrc in every step, so the token it references is
      # available job-wide rather than only during install.
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Check runtime versions
        run: python3 scripts/check_versions.py
      # Reads packageManager from package.json; do not repeat the version here.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      # pnpm only expands credentials from user-level config. The literal
      # ${NODE_AUTH_TOKEN} is expanded at runtime; no token is written.
      - name: Configure GitHub Packages auth
        run: |
          # shellcheck disable=SC2016 # pnpm, not the shell, expands the literal
          echo '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' >> ~/.npmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Package static release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          tar -czf site.tar.gz -C dist .
          python3 scripts/release.py create
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: release-${{ github.run_attempt }}
          path: |
            release.json
            site.tar.gz
          retention-days: 90
          if-no-files-found: error
